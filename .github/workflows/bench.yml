name: Geniex Bench
run-name: bench (${{ inputs.model || 'all models' }} · ${{ inputs.device || 'all chips' }} · ${{ inputs.compute || 'default units' }})

on:
  workflow_dispatch:
    inputs:
      device:
        description: "QDC chipsets, comma-separated (blank = all)"
        type: string
        default: ""
      model:
        description: "Model ids org/name[:quant], comma-separated; any model geniex can pull (blank = every model in bench-models.json)"
        type: string
        default: ""
      compute:
        description: "Compute units, comma-separated: cpu/gpu/npu/hybrid (blank = bench-models.json units, or cpu,gpu,npu for other models)"
        type: string
        default: ""
      ctx:
        description: "Context sizes, comma-separated (blank = 512,1024,4096)"
        type: string
        default: ""
      pp:
        description: "Prefill token counts, comma-separated matching ctx (blank = ctx-tg per cell)"
        type: string
        default: ""
      tg:
        description: "Decode token counts, comma-separated matching ctx (blank = 128 per cell)"
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  build-sdk:
    uses: ./.github/workflows/_build-sdk.yml
    secrets: inherit
    with:
      upload_artifact: true

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      devices: ${{ steps.set.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        env:
          PICK_DEVICE: ${{ inputs.device }}
          PICK_MODEL: ${{ inputs.model }}
          PICK_COMPUTE: ${{ inputs.compute }}
        run: |
          python3 sdk/benchmark/qdc/run_qdc_jobs.py \
            --mode bench_plan \
            --device "$PICK_DEVICE" \
            --models "$PICK_MODEL" \
            --compute "$PICK_COMPUTE"

  bench:
    name: ${{ matrix.device }} · ${{ matrix.entry.model }}${{ matrix.entry.spec && ' (mtp)' || '' }}
    needs: [build-sdk, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 355 # just under the GitHub-hosted 6h job hard cap
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      QDC_API_KEY: ${{ secrets.QDC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: sdk
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          case "$DEVICE" in
            SM*)         echo "name=sdk-android-arm64" ;;
            SC*|CRD*|X*) echo "name=sdk-windows-arm64" ;;
            *)           echo "name=sdk-linux-arm64" ;;
          esac >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.sdk.outputs.name }}
          path: pkg-geniex
      - uses: ./.github/actions/install-qdc-sdk
      - env:
          DEVICE: ${{ matrix.device }}
          ENTRY: ${{ toJson(matrix.entry) }}
          SLUG: ${{ matrix.entry.slug }}
          CTX: ${{ inputs.ctx }}
          PP: ${{ inputs.pp }}
          TG: ${{ inputs.tg }}
        run: |
          python sdk/benchmark/qdc/run_qdc_jobs.py \
            --pkg-dir pkg-geniex \
            --device "$DEVICE" \
            --entry "$ENTRY" \
            --ctx "$CTX" \
            --pp "$PP" \
            --tg "$TG" \
            --out "$DEVICE-$SLUG.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-cells-${{ matrix.device }}-${{ matrix.entry.slug }}
          path: ${{ matrix.device }}-${{ matrix.entry.slug }}.json
          if-no-files-found: ignore

  aggregate:
    name: aggregate · ${{ matrix.device }}
    needs: [plan, bench]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: ${{ fromJson(needs.plan.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-cells-${{ matrix.device }}-*
          path: cells
      - env:
          DEVICE: ${{ matrix.device }}
        run: |
          python sdk/benchmark/qdc/run_qdc_jobs.py \
            --mode bench_aggregate \
            --device "$DEVICE" \
            --in-dir cells
